services:
  # NestJS 后端 API & WebSocket 服务
  nest-api:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: care_backend
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    command: sh -c "npx prisma db push && node dist/src/main.js"
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      coturn:
        condition: service_started

  # MySQL 8.0 数据库
  mysql-db:
    image: mysql:8.0
    container_name: care_mysql
    restart: always
    expose:
      - "${MYSQL_PORT}"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务
  redis-cache:
    image: redis:alpine
    container_name: care_redis
    restart: always
    expose:
      - "${REDIS_PORT}"
    volumes:
      - redis_data:/data

  # WebRTC TURN 中继服务
  coturn:
    image: coturn/coturn:latest
    container_name: care_coturn
    restart: always
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --realm=telecare.local
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      - --listening-ip=0.0.0.0
      - --listening-port=${TURN_PORT}
      - --relay-ip=${TURN_RELAY_IP}
      - --min-port=${TURN_MIN_PORT}
      - --max-port=${TURN_MAX_PORT}
      - --user=${WEBRTC_TURN_USERNAME}:${WEBRTC_TURN_CREDENTIAL}
      - --external-ip=${TURN_EXTERNAL_IP}/${TURN_RELAY_IP}
    ports:
      - "${TURN_PORT}:${TURN_PORT}"
      - "${TURN_PORT}:${TURN_PORT}/udp"
      - "${TURN_MIN_PORT}-${TURN_MAX_PORT}:${TURN_MIN_PORT}-${TURN_MAX_PORT}/udp"
    networks:
      turn_net:
        ipv4_address: ${TURN_RELAY_IP}

volumes:
  mysql_data:
  redis_data:

networks:
  turn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
