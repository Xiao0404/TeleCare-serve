services:
  # NestJS 后端 API & WebSocket 服务
  nest-api:
    build: .
    container_name: care_backend
    restart: always
    ports:
      - "3500:3500"
    environment:
      - NODE_ENV=production
      - PORT=3500
      - DATABASE_URL=mysql://root:care_pwd_2024@mysql-db:3306/care_db
      - REDIS_URL=redis://redis-cache:6379
      - JWT_SECRET=your_super_secret_key_for_jwt
      - WEBRTC_STUN_URLS=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - WEBRTC_TURN_URLS=turn:${TURN_PUBLIC_HOST:-159.75.70.82}:3478?transport=udp,turn:${TURN_PUBLIC_HOST:-159.75.70.82}:3478?transport=tcp
      - WEBRTC_TURN_USERNAME=${WEBRTC_TURN_USERNAME:-telecare}
      - WEBRTC_TURN_CREDENTIAL=${WEBRTC_TURN_CREDENTIAL:-telecare_turn_2026}
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      coturn:
        condition: service_started

  # MySQL 8.0 数据库
  mysql-db:
    image: mysql:8.0
    container_name: care_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: care_pwd_2024
      MYSQL_DATABASE: care_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务
  redis-cache:
    image: redis:alpine
    container_name: care_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # WebRTC TURN 中继服务
  coturn:
    image: coturn/coturn:latest
    container_name: care_coturn
    restart: always
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --realm=telecare.local
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      - --listening-ip=0.0.0.0
      - --listening-port=3478
      - --relay-ip=${TURN_RELAY_IP:-172.30.0.10}
      - --min-port=49160
      - --max-port=49200
      - --user=${WEBRTC_TURN_USERNAME:-telecare}:${WEBRTC_TURN_CREDENTIAL:-telecare_turn_2026}
      - --external-ip=${TURN_EXTERNAL_IP:-159.75.70.82}/${TURN_RELAY_IP:-172.30.0.10}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      turn_net:
        ipv4_address: ${TURN_RELAY_IP:-172.30.0.10}

volumes:
  mysql_data:
  redis_data:

networks:
  turn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
